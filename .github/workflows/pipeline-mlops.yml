name: Pipeline MLOps - Groove Bot

on:
  push:
    branches:
      - main 

jobs:
  # ==========================================
  # FASE 1: INTEGRAÇÃO CONTÍNUA (TESTES)
  # ==========================================
  testes-automatizados:
    name: Rodar Avaliação do Agente RAG
    runs-on: ubuntu-latest 

    steps:
      - name: 📥 Baixar o código do repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Instalar Dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Executar Testes de Acurácia (Baseline > 80%)
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          AZURE_LLM_KEY: ${{ secrets.AZURE_LLM_KEY }}
          AZURE_LLM_ENDPOINT: ${{ secrets.AZURE_LLM_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT_NAME: ${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME }}
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          AZURE_LLM_JUDGE_KEY: ${{ secrets.AZURE_LLM_JUDGE_KEY }}
          AZURE_LLM_JUDGE_ENDPOINT: ${{ secrets.AZURE_LLM_JUDGE_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT_NAME_JUDGE: ${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME_JUDGE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          export PYTHONPATH=.
          python test/test.py

  # ==========================================
  # FASE 2: ENTREGA CONTÍNUA (DOCKER PUSH)
  # ==========================================
  deploy-docker:
    name: 🐳 Construir e Enviar para o ACR
    needs: testes-automatizados # Trava de Segurança: Só roda se o teste passar!
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Baixar o código
        uses: actions/checkout@v4

      - name: 🔐 Login no Azure
        run: |
          # Usamos a Service Principal para entrar silenciosamente
          az login --service-principal -u ${{ secrets.AZURE_CLIENT_ID }} -p ${{ secrets.AZURE_CLIENT_SECRET }} --tenant ${{ secrets.AZURE_TENANT_ID }}
          
      - name: 🔑 Login no Estacionamento (ACR)
        run: |
          az acr login --name acrgroovebotenzo
          
      - name: 🏗️ Construir Imagem Docker
        run: |
          # Criamos a imagem com a placa exata do seu ACR
          docker build -t acrgroovebotenzo.azurecr.io/groove-bot:latest .
          
      - name: 🚀 Empurrar para a Nuvem (Push)
        run: |
          docker push acrgroovebotenzo.azurecr.io/groove-bot:latest